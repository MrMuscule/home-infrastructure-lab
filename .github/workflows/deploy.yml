name: Deploy API

on:
  workflow_run:
    workflows: ["API CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          SSH_DIR="${RUNNER_TEMP}/deploy-ssh"

          echo "Creating SSH directory..."
          mkdir -p "$SSH_DIR"

          echo "Writing private key..."
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$SSH_DIR/github_actions"
          chmod 600 "$SSH_DIR/github_actions"

          echo "Scanning host key..."
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" > "$SSH_DIR/known_hosts"

          echo "SSH configuration complete"

          echo "SSH_DIR=$SSH_DIR" >> "$GITHUB_ENV"

      - name: Test SSH connection
        shell: bash
        run: |
          ssh \
            -i "$SSH_DIR/github_actions" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "echo SSH connection successful"

      - name: Deploy files
        shell: bash
        run: |
          rsync -avz --delete \
            --exclude 'api.env' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            -e "ssh -i $SSH_DIR/github_actions -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts" \
            backend/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/api/"

      - name: Rebuild and restart API
        shell: bash
        run: |
          ssh \
            -i "$SSH_DIR/github_actions" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd ~/api && docker compose up -d --build'

      - name: Health check
        shell: bash
        run: |
          sleep 5
          curl --fail \
            "http://${{ secrets.DEPLOY_HOST }}:8082/health"

          echo "Deployment successful"