name: Deploy API

on:
  workflow_run:
    workflows: ["API CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, Linux, X64, web02]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy files
        run: |
          rsync -av --delete \
            --exclude 'api.env' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            backend/ /home/danil/api/

      - name: Rebuild and restart API
        run: |
          cd /home/danil/api
          docker compose up -d --build

      - name: Health check
        run: |
          sleep 5
          curl --fail http://127.0.0.1:8082/health