---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Deploy lab reverse proxy configuration
  ansible.builtin.template:
    src: lab-api.conf.j2
    dest: /etc/nginx/sites-available/lab-api.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nginx

- name: Enable lab reverse proxy
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lab-api.conf
    dest: /etc/nginx/sites-enabled/lab-api.conf
    state: link
  notify: Restart Nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx
